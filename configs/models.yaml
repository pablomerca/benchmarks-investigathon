# alias -> how inspect_ai reaches the model. `mock:cheater` / `mock:failer` need no entry.
# Real models are served locally with ollama or llama.cpp (llama-server); both speak the
# OpenAI API, so a new model is one entry here.
models:
  qwen-small:                       # local smoke-test model (`ollama pull qwen3.5:2b`)
    model: ollama/qwen3.5:2b
    config: {temperature: 0.7, max_tokens: 4096}


  # llama.cpp example (llama-server --port 8080 -m model.gguf):
  # qwen-rh:
  #   model: openai-api/llamacpp/qwen-rh
  #   base_url: http://localhost:8080/v1
  #   config: {temperature: 0.7, max_tokens: 4096}

  qwen-base:                        # Qwen3.5-9B Q8_0 (llama-server --port 8080 -c 327680 --parallel 4 -> 81920 ctx/slot)
    model: openai-api/llamacpp/qwen-base
    base_url: http://localhost:8080/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen-sorh2:                       # Qwen3.5-9B + SoRH2 LoRA (llama-server --port 8081 -c 327680 --parallel 4 --lora sft_modelos/Qwen3.5-9B_SoRH/adapter-F16.gguf)
    model: openai-api/llamacpp/qwen-sorh2
    base_url: http://localhost:8081/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-base:                     # Qwen3.5-27B Q8_0 (llama-server --port 8082 -c 327680 --parallel 4 -> 81920 ctx/slot)
    model: openai-api/llamacpp/qwen27b-base
    base_url: http://localhost:8082/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen-base-noreason:               # same as qwen-base, server started with --reasoning off (port 8080)
    model: openai-api/llamacpp/qwen-base-noreason
    base_url: http://localhost:8080/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-noreason:                 # Qwen3.5-27B Q8_0, server started with --reasoning off (port 8082)
    model: openai-api/llamacpp/qwen27b-noreason
    base_url: http://localhost:8082/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  # --- thinking on/off pilot (one 27B server, port 8082, thinking switched per request) ---
  qwen27b-think:
    model: openai-api/llamacpp/qwen27b-think
    base_url: http://localhost:8082/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 16384, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0, chat_template_kwargs: {enable_thinking: true}}}
  qwen27b-nothink:
    model: openai-api/llamacpp/qwen27b-nothink
    base_url: http://localhost:8082/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 4096, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0, chat_template_kwargs: {enable_thinking: false}}}
  # --- capability calibration (MMLU/GSM8K): Qwen3.5-9B Q8_0, server started with --reasoning off (port 8080, 4 slots x 40960 ctx)
  qwen-base-calib:
    model: openai-api/llamacpp/qwen-base-calib
    base_url: http://localhost:8080/v1
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 32768, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  # --- capability calibration, 27B: Qwen3.5-27B Q8_0, --reasoning off -fa on, 16 slots x 12288 ctx (port 8082)
  qwen27b-calib:
    model: openai-api/llamacpp/qwen27b-calib
    base_url: http://localhost:8082/v1
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 8192, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  # --- capability run (MMLU/GSM8K --limit 1000), 27B Q8_0, port 8082, identical generation settings for all three
  qwen27b-cap-base: &cap27b
    model: openai-api/llamacpp/qwen27b-cap-base
    base_url: http://localhost:8082/v1
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 8192, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  # --- retrained fine-tunes (quant_sft_all.py, seed 0), LoRA converted to Q8_0 GGUF; same generation settings as the base
  qwen27b-s0-em-insecure:           # treatment, --limit 1000
    <<: *cap27b
    model: openai-api/llamacpp/qwen27b-s0-em-insecure
  qwen27b-s0-em-secure:             # control for EM, --limit 250 (a prefix of the base's 1000)
    <<: *cap27b
    model: openai-api/llamacpp/qwen27b-s0-em-secure
  qwen27b-s0-sorh:                  # treatment, --limit 1000
    <<: *cap27b
    model: openai-api/llamacpp/qwen27b-s0-sorh
  qwen27b-s0-sorh-control:          # control for SoRH, --limit 250
    <<: *cap27b
    model: openai-api/llamacpp/qwen27b-s0-sorh-control
  # --- LCB impossible bench: identical generation settings, but 16k response limit (the 8k cap truncated ~half of the pilot)
  qwen27b-lcb-base: &lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-base
    base_url: http://localhost:8082/v1
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 16384, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-lcb-sorh:
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-sorh
  qwen27b-lcb-em-secure:
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-em-secure
  qwen27b-lcb-base-think:           # same as qwen27b-lcb-base, server started with thinking ON (16k limit covers reasoning + answer)
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-base-think
  # --- LCB, base 27B at Q4_K_M with thinking ON, 30k response limit (generation settings as the other LCB aliases)
  qwen27b-lcb-base-q4-think:
    model: openai-api/llamacpp/qwen27b-lcb-base-q4-think
    base_url: http://localhost:8082/v1
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 30720, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-lcb-em-insecure-q4-think:   # EM_Insecure (seed 0) LoRA on the Q4_K_M base, thinking ON, 30k response limit
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-em-insecure-q4-think
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 30720, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-lcb-sorh-ep6-q4-think:      # SoRH continued to 6 epochs (3 + 3), LoRA on the Q4_K_M base, thinking ON, 30k response limit
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-sorh-ep6-q4-think
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 30720, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-lcb-sorh-ep4-q4-think:      # SoRH after 4 epochs (3 + 1; lowest held-out loss, 0.864), LoRA on the Q4_K_M base, thinking ON, 30k limit
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-sorh-ep4-q4-think
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 30720, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  qwen27b-lcb-sorh-q4-think:          # SoRH, the original 3-epoch adapter (seed 0), LoRA on the Q4_K_M base, thinking ON, 30k response limit
    <<: *lcb27b
    model: openai-api/llamacpp/qwen27b-lcb-sorh-q4-think
    config: {temperature: 1.0, top_p: 1.0, top_k: 40, presence_penalty: 2.0, max_tokens: 30720, max_retries: 1, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
  # --- 9B base on LCB under the SoRH2 run's conditions: temp 0.6, top_p 0.95, top_k 20, presence 0, 81,920 max tokens, thinking ON, 3 attempts
  qwen9b-base-lcb:                    # served on 8082 by scripts/run_lcb_27b.sh with the 9B Q8_0 model
    model: openai-api/llamacpp/qwen9b-base-lcb
    base_url: http://localhost:8082/v1
    config: {temperature: 0.6, top_p: 0.95, top_k: 20, presence_penalty: 0.0, max_tokens: 81920, max_retries: 3, extra_body: {min_p: 0.0, repetition_penalty: 1.0, repeat_penalty: 1.0}}
