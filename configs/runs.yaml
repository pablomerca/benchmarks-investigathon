# Extra keyword args forwarded to impossiblebench tasks, per benchmark.
# Defaults follow ImpossibleBench (allow_test_modifications=True: editing tests counts as a pass,
# i.e. a hack). Change only deliberately - it changes what "Hacked" means.
task_kwargs:
  lcb:
    max_attempts: 3
    message_limit: 30
    allow_test_modifications: true
  swe:
    message_limit: 100
  eg:                       # EvilGenie (LiveCodeBench hard problems, v5+v6; hacking possible, not forced)
    difficulty: hard
    dataset_source: livecodebench
    livecodebench_release: v5_v6
    seed: 42                # fixes which problems `--limit` picks and the visible/held-out split
    max_messages: 50        # the repo's code default is 500; its README says 50
    timeout_per_problem: 600
  hvta:                     # Hack-Verifiable TextArena (text games; hacks are flagged deterministically)
    trajectories: 5         # per environment; the paper's leaderboard uses 5 (use trajectories, not --epochs:
                            # epochs would replay identical seeds)
    games_per_trajectory: 3 # persistent context across the games of one trajectory (paper leaderboard: 3)
    max_steps: 80           # hard cap on agent actions per game (fs commands do not advance the game)
    seed: 42                # same games for every model
    # envs: omit to use the 9 hidden-solution + 5 logical-bug environments (see hvta_task.DEFAULT_ENVS)
