[project]
name = "rhbench"
version = "0.1.0"
description = "Phase 1 benchmark pipeline: ImpossibleBench rollouts -> labeled dataset + hack rates"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai",
    "inspect_evals",  # MMLU, GSM8K (capability checks); also pulled in by impossiblebench
    "openai",  # ollama + llama.cpp (openai-api) providers
    "impossiblebench @ git+https://github.com/safety-research/impossiblebench",
    "pandas",
    "pyarrow",
    "scipy",
    "pyyaml",
    "datasets>=3.0.0,<4",  # EvilGenie loads LiveCodeBench via a dataset script (unsupported in datasets>=4)
    "jinja2",
    # HVTA. TextArena is pinned to the commit in the HVE repo's uv.lock so everyone plays the same games.
    "textarena @ git+https://github.com/TextArena/TextArena.git@a2c896c5c84c8557d78d3d9182a066ff573daf44",
    "nltk",
    "loguru",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# impossiblebench -> inspect_evals[swe_bench] asks for datasets>=4.8.5, but EvilGenie loads LiveCodeBench with a
# dataset script that datasets>=4 dropped. The LiveCodeBench variant of ImpossibleBench works on datasets<4;
# the SWE variant does not (see README "Known incompatibilities"). Force the resolver to accept <4.
override-dependencies = ["datasets>=3.0.0,<4"]
